version: "3.8"

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/polist
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      UPLOAD_PATH: /tmp
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: polist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - polist-db-data:/var/lib/postgresql/data

volumes:
  polist-db-data:
